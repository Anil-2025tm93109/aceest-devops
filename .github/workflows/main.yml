name: ACEest Fitness CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py tests

      - name: Lint with ruff
        run: ruff check app.py tests

  docker-build-and-test:
    name: Docker Build & Test
    needs: build-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:test

      - name: Build runtime image
        run: docker build -t aceest-fitness:ci .

      - name: Smoke-test the runtime container
        run: |
          docker run -d --name aceest-ci -p 5000:5000 aceest-fitness:ci
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 1 --retry-connrefused \
            http://localhost:5000/health
          echo
          test "$(docker exec aceest-ci id -u)" != "0"
          echo "Container runs as a non-root user"

      - name: Show container logs on failure
        if: failure()
        run: docker logs aceest-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f aceest-ci || true
