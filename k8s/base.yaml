apiVersion: v1
kind: Namespace
metadata:
  name: aceest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-v2
  namespace: aceest
  labels:
    app: aceest-fitness
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      version: v2
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: v2
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:v2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-service
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    version: v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
