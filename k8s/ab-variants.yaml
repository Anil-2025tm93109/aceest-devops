apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-a
  namespace: aceest
  labels:
    app: aceest-fitness
    version: a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      version: a
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: a
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:v2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-a-service
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    version: a
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082
---
